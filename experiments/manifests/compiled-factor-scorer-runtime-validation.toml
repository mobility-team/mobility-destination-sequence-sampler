schema_version = 1
id = "compiled-factor-scorer-runtime-validation"
kind = "pure_perf"
stage = "validation"
hypothesis = "Compiling immutable layer-local scoring inputs once per context reduces aggregate Rust search time by at least 8% with identical outputs and semantic work."
mechanism = "Factor-map scans reuse direct activity-table references, first-choice state, terminal state, and adjacent step data instead of repeating hash lookups and invariant branches for every destination."
falsifier = "Reject the compiled scorer if output fingerprints or work counters differ, aggregate Rust improves by less than 8%, or either paired block regresses on the locked 20,000-context cohort."
unknowns = ["The relative benefit may shrink when cache and scheduler effects dominate the full 81,844-context workload."]

[comparison]
allowed_differences = ["candidate_strategy"]

