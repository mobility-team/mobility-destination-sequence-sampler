kind = "quality_only"
stage = "validation"
hypothesis = "Using asymmetric factor maps only when fixed destinations separate every variable run and no anchor repeats preserves post-stratified Mass@10 and certified zero-overlap count."
mechanism = "Ordinary exact factor maps observe both boundaries of an isolated variable, while symmetric partial messages remain enabled for adjacent unknowns and non-local repeated-anchor constraints."
falsifier = "Reject the router if post-stratified Mass@10 decreases or certified zero-overlap cases increase on the locked validation cohort."
unknowns = ["A fixed boundary can still couple the variables on either side through its local factor, so the structural condition is empirical rather than an exact decomposition."]

